[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zynex-runner"
version = "0.1.0"
description = "MVP runner for Zynex validation"
requires-python = ">=3.10"
dependencies = [
    "zynex>=1.0.0",
    "pyyaml",
]

[project.scripts]
zynex-runner = "runner.main:main"